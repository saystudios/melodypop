# Say Piano: builds the iPhone/iPad app on GitHub's Mac computers and uploads it to
# App Store Connect (TestFlight). No Mac needed. Same setup as Say Math.
#
# Run it from GitHub: Actions > "Build iPhone app" > Run workflow.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions) — the same
# values you use for Say Math:
#   APPLE_TEAM_ID   10-character Team ID from developer.apple.com > Membership
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      full text of the AuthKey_XXXX.p8 file (including BEGIN/END lines)
# That's all: no .p12 certificate or provisioning profile is needed. The app is signed with
# Apple's cloud-managed distribution certificate through the API key (the key needs Admin
# access). Nothing is created or revoked on your account, so builds never "rotate" certificates.
# Optional:
#   BUNDLE_ID       defaults to com.saystudios.melodypop
# The App ID is registered automatically on the first run. You must create the app once in
# App Store Connect (Apps > + > New App) with the same bundle ID before the upload can succeed.

name: Build iPhone app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number shown on the App Store (for example 1.0)"
        required: true
        default: "1.0"

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID || 'com.saystudios.melodypop' }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
      VER: ${{ inputs.version }}
      BUILD: ${{ github.run_number }}
      APP_NAME: Say Piano
    steps:
      - uses: actions/checkout@v5

      - name: Check setup
        run: |
          missing=""
          for v in TEAM KEY_ID ISSUER P8; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 in Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "Building Say Piano $VER (build $BUILD) for $BUNDLE_ID"

      - name: Pick the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: App Store Connect key
        run: |
          mkdir -p ~/private_keys
          F=~/private_keys/AuthKey_$KEY_ID.p8
          # Rebuild the key file, whatever way it was pasted (missing lines, extra spaces, Windows line endings)
          BODY=$(printf '%s' "$P8" | tr -d '\r' | sed -e 's/-----BEGIN [A-Z ]*-----//g' -e 's/-----END [A-Z ]*-----//g' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$F"
          if ! openssl pkey -in "$F" -noout 2>/dev/null && ! openssl ec -in "$F" -noout 2>/dev/null; then
            echo "::error::The ASC_KEY_P8 secret is not a valid Apple key. Open the AuthKey_${KEY_ID}.p8 file, copy ALL of its text and save it again as the ASC_KEY_P8 secret."
            exit 1
          fi
          echo "Apple key looks good (${#BODY} characters)."

      - name: Check Apple login
        run: |
          cat > /tmp/check.rb <<'EOF'
          require 'openssl'; require 'json'; require 'base64'; require 'net/http'; require 'uri'
          kid=ENV['KEY_ID'].to_s.strip; iss=ENV['ISSUER'].to_s.strip; bid=ENV['BUNDLE_ID'].to_s.strip
          key=OpenSSL::PKey.read(File.read(ENV['KEYFILE']))
          b64=->(s){ Base64.urlsafe_encode64(s, padding: false) }
          now=Time.now.to_i
          data=b64.({alg:'ES256',kid:kid,typ:'JWT'}.to_json)+'.'+b64.({iss:iss,iat:now,exp:now+600,aud:'appstoreconnect-v1'}.to_json)
          der=key.sign(OpenSSL::Digest::SHA256.new, data)
          seq=OpenSSL::ASN1.decode(der)
          sig=seq.value.map{|i| i.value.to_s(2).rjust(32,"\0")}.join
          jwt=data+'.'+b64.(sig)
          problems=[]
          problems << "ASC_KEY_ID should be 10 letters and numbers (it has #{kid.length} characters)." unless kid =~ /\A[A-Z0-9]{10}\z/
          problems << "ASC_ISSUER_ID should look like 12345678-abcd-1234-abcd-123456789012 (it has #{iss.length} characters)." unless iss =~ /\A\h{8}-\h{4}-\h{4}-\h{4}-\h{12}\z/
          problems << "BUNDLE_ID has spaces or unusual characters." unless bid =~ /\A[A-Za-z0-9.\-]+\z/
          problems.each{|p| puts "::error::#{p}"}
          uri=URI("https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=#{bid}&limit=5")
          req=Net::HTTP::Get.new(uri); req['Authorization']="Bearer #{jwt}"
          res=Net::HTTP.start(uri.host,uri.port,use_ssl:true){|h| h.request(req)}
          case res.code
          when '200'
            ids=JSON.parse(res.body)['data'].map{|d| d['attributes']['identifier']}
            if ids.include?(bid) then puts "Apple login works, and the App ID #{bid} is registered."
            else
              puts "Apple login works. Registering the App ID #{bid}..."
              body={data:{type:'bundleIds',attributes:{identifier:bid,name:ENV['APP_NAME'],platform:'IOS'}}}.to_json
              preq=Net::HTTP::Post.new(URI('https://api.appstoreconnect.apple.com/v1/bundleIds'))
              preq['Authorization']="Bearer #{jwt}"; preq['Content-Type']='application/json'; preq.body=body
              pres=Net::HTTP.start(uri.host,uri.port,use_ssl:true){|h| h.request(preq)}
              if pres.code=='201' then puts "Registered the App ID #{bid}."
              else puts "::error::Could not register the App ID #{bid} (#{pres.code}): #{pres.body[0,300]}"; exit 1 end
            end
          when '401'
            puts "::error::Apple rejected the login (401). ASC_KEY_ID and ASC_ISSUER_ID must come from the same Team Keys page as the AuthKey file. Check that ASC_KEY_ID matches the file name AuthKey_XXXXXXXXXX.p8, and copy the Issuer ID again."; exit 1
          when '403'
            puts "::error::Apple login works, but this key is not allowed to do this (403). Make a Team Key with Admin access and update ASC_KEY_ID and ASC_KEY_P8."; exit 1
          else
            puts "::error::Unexpected answer from Apple (#{res.code}): #{res.body[0,300]}"; exit 1
          end
          exit 1 unless problems.empty?
          areq=Net::HTTP::Get.new(URI("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=#{bid}&limit=5"))
          areq['Authorization']="Bearer #{jwt}"
          ares=Net::HTTP.start(uri.host,uri.port,use_ssl:true){|h| h.request(areq)}
          apps=ares.code=='200' ? JSON.parse(ares.body)['data'] : []
          if apps.empty?
            puts "::error::There is no app in App Store Connect with bundle ID #{bid} yet. Create it once: App Store Connect > Apps > + > New App (platform iOS, name Say Piano, bundle ID #{bid}, any SKU), then run this again."
            exit 1
          end
          puts "Found the App Store Connect app: #{apps[0]['attributes']['name']}"
          EOF
          KEYFILE=~/private_keys/AuthKey_$KEY_ID.p8 ruby /tmp/check.rb

      - name: Set up App Store signing in the project
        run: python3 .github/scripts/set-signing.py MelodyPop.xcodeproj/project.pbxproj

      - name: Build the app
        run: |
          # Archived without signing; the export step below signs it for the App Store.
          xcodebuild -project MelodyPop.xcodeproj -scheme MelodyPop -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MelodyPop.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive > "$RUNNER_TEMP/build.log" 2>&1 || true
          tail -n 200 "$RUNNER_TEMP/build.log"
          grep -E "error:|\*\* ARCHIVE FAILED" "$RUNNER_TEMP/build.log" | sort -u | head -n 8 | while IFS= read -r l; do echo "::error::$l"; done
          test -d "$RUNNER_TEMP/MelodyPop.xcarchive" || { echo "::error::Build failed. Scroll up for the first error."; exit 1; }

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MelodyPop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" 2>&1 | tee "$RUNNER_TEMP/export.log"
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            grep -E "error:|Error Domain|No Accounts|No profiles|cloud|Cloud|App Store Connect" "$RUNNER_TEMP/export.log" | sort -u | head -n 8 | while IFS= read -r l; do echo "::error::$l"; done
            if grep -qiE "app record|No suitable application records|could not find.*app" "$RUNNER_TEMP/export.log"; then
              echo "::error::Create the app once in App Store Connect (Apps > + > New App) with bundle ID $BUNDLE_ID, then run this again."
            fi
            exit 1
          fi
          echo "Uploaded Say Piano $VER (build $BUILD). It appears in App Store Connect > TestFlight in about 15-30 minutes."

      - name: Clean up key
        if: always()
        run: rm -rf ~/private_keys
